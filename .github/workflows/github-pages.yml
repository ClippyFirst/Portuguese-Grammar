name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:github-pages

      - name: Generate sitemap
        run: npm run generate:static:sitemap

      - name: Verify prerendered routes
        run: npm run verify:static

      - name: Stage Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          if [ -d .output/public ] && [ -f .output/public/index.html ]; then
            cp -a .output/public site
          elif [ -d dist/client ] && [ -f dist/client/index.html ]; then
            cp -a dist/client site
          elif [ -d dist ] && [ -f dist/index.html ]; then
            cp -a dist site
          else
            echo "No static site output with a top-level index.html was found." >&2
            exit 1
          fi
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
