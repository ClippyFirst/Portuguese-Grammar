name: Reference QA

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The repository lockfile currently predates a transitive lru-cache peer required by the pinned toolchain.
      # Install resolves that graph before the actual QA commands; lockfile reconciliation is tracked separately.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run audit:content
      - run: npm run build
